name: Update boards

# Game days only, and only when the props are worth buying.
#
# The Odds API charges one credit per market per region for every event it
# prices, so the cost of a run is (games priced x 5 markets). Two things keep
# that down:
#
#   1. These four slots. Tuesday, Wednesday, Friday and Saturday have no NFL
#      games in a normal week, so a run then would spend credits refreshing
#      lines nobody is betting into.
#   2. update.js only buys props for games kicking off within 30 hours. Books
#      do not post player props a week out, so pricing next Sunday's games on a
#      Monday bought sixteen empty responses. With the window, the Thursday and
#      Monday runs cost about five credits each instead of eighty.
#
# That puts a normal week near 90 credits — Thursday and Monday at ~5 each for
# the single night game, Sunday morning at ~65 for the main slate, and Sunday
# evening at ~5 for the night game. Roughly 380 a month, inside the free tier's
# 500 with headroom for a manual run.
#
# Each slot is placed about two hours before its kick-off, which is after
# inactives are announced (90 minutes out) and after the lines have firmed up.
on:
  schedule:
    - cron: '0 22 * * 4'   # Thursday  5:00 PM CT - before Thursday Night Football
    - cron: '0 15 * * 0'   # Sunday   10:00 AM CT - before the early slate
    - cron: '0 23 * * 0'   # Sunday    6:00 PM CT - before Sunday Night Football
    - cron: '0 22 * * 1'   # Monday    5:00 PM CT - before Monday Night Football
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-boards
  cancel-in-progress: false

jobs:
  boards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify the betting and scoring math
        run: npm test

      - name: Build the boards
        run: node scripts/update.js
        env:
          ODDS_API_KEY: ${{ secrets.TheOdds_API_Key }}

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Boards unchanged; nothing to commit."
          else
            git commit -m "Update boards ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
            git push
          fi
