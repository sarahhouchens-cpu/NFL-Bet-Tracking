name: Update boards

# Twice a week, not hourly.
#
# The Odds API charges one credit per market per region for every event it
# prices. Five prop markets across sixteen games is eighty credits a run, so on
# the free tier's 500 a month this schedule costs about 640 — comfortably inside
# a paid tier and deliberately sized so it cannot silently drain a free one.
# update.js also keeps a credit reserve and stops pricing games rather than
# running the quota to zero mid-week.
#
# Times are chosen for when the props are worth having: Thursday morning once
# the week's lines are posted, and Sunday morning once the inactives are known
# and the lines have firmed up.
on:
  schedule:
    - cron: '0 15 * * 4'   # Thursday, 10:00 AM CT
    - cron: '0 14 * * 0'   # Sunday,   9:00 AM CT
    - cron: '0 16 * * 0'   # Sunday,  11:00 AM CT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-boards
  cancel-in-progress: false

jobs:
  boards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify the betting and scoring math
        run: npm test

      - name: Build the boards
        run: node scripts/update.js
        env:
          ODDS_API_KEY: ${{ secrets.TheOdds_API_Key }}

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Boards unchanged; nothing to commit."
          else
            git commit -m "Update boards ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
            git push
          fi
