name: Update boards

# Game days only, and only for games whose props are actually posted.
#
# This key is shared with the Brewers tracker, and both draw on one 500-credit
# monthly allowance. NFL is by far the greedier of the two: a Sunday morning run
# prices a dozen games at five markets each, where the baseball job spends three
# credits on a single game. So the budget here is set deliberately, not
# generously.
#
# What a run actually costs is (games priced x 5 markets). Three things hold
# that down:
#
#   1. These slots. Tuesday, Wednesday, Friday and Saturday have no NFL games in
#      a normal week, so a run then refreshes lines nobody is betting into.
#   2. update.js only buys props for games kicking off within 30 hours. Books do
#      not post player props a week out, so pricing next Sunday's games on a
#      Monday bought sixteen empty responses for eighty credits.
#   3. A credit reserve (ODDS_CREDIT_RESERVE, default 150) that this job will
#      not spend below, so a heavy NFL Sunday cannot eat the baseball board's
#      month.
#
# The result is roughly 80 credits a week: Thursday and Monday at ~7 each for
# one night game, and Sunday morning at ~67 for the main slate. Call it 350 a
# month, which leaves ~150 for the Brewers job inside the free 500.
#
# The Sunday evening slot was removed deliberately. It cost ~12 credits to
# reprice the Sunday night game a few hours closer and the Monday night game a
# day early — and Monday's own run covers the latter properly.
#
# Each slot sits about two hours before its kick-off, which is after inactives
# are announced (90 minutes out) and after the lines have firmed up.
on:
  schedule:
    - cron: '0 22 * * 4'   # Thursday  5:00 PM CT - before Thursday Night Football
    - cron: '0 15 * * 0'   # Sunday   10:00 AM CT - before the early slate
    - cron: '0 22 * * 1'   # Monday    5:00 PM CT - before Monday Night Football
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-boards
  cancel-in-progress: false

jobs:
  boards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Verify the betting and scoring math
        run: npm test

      - name: Build the boards
        run: node scripts/update.js
        env:
          ODDS_API_KEY: ${{ secrets.TheOdds_API_Key }}
          # Credits this job will not spend below, leaving room for the Brewers
          # tracker on the same key. Set a repository variable to change it
          # without touching this file.
          ODDS_CREDIT_RESERVE: ${{ vars.ODDS_CREDIT_RESERVE || '150' }}
          ODDS_MAX_GAMES: ${{ vars.ODDS_MAX_GAMES || '14' }}
          ODDS_MARKETS: ${{ vars.ODDS_MARKETS }}

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Boards unchanged; nothing to commit."
          else
            git commit -m "Update boards ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
            git push
          fi
